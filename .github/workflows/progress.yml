# Publishes the progress report for decomp.dev.
# The ROM never goes to CI: progress/report.json is generated locally with objdiff (tools/hh/progress.py)
# by someone who has their own ROM, committed, and this workflow just uploads it as the `us_report` artifact.
name: progress
on:
  # every push to main: a `paths:` filter only sees the first 300 changed files, so big updates were skipped
  push:
    branches: [main]
  workflow_dispatch:
jobs:
  report:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Upload report
        uses: actions/upload-artifact@v4
        with:
          name: us_report
          path: progress/report.json
