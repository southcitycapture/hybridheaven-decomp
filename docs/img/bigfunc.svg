<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 182" width="720" height="182" font-family="'Share Tech Mono','Eurostile','Bank Gothic',Consolas,'DejaVu Sans Mono',monospace" role="img" aria-label="Big functions (2 KB and up): one lead, many helpers"><defs><pattern id="scan" width="4" height="4" patternUnits="userSpaceOnUse"><rect width="4" height="1" fill="#ffffff" opacity="0.035"/></pattern><linearGradient id="panel" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#0b1626"/><stop offset="1" stop-color="#060d18"/></linearGradient></defs><rect width="100%" height="100%" fill="#060d18"/><rect x="3" y="3" width="714" height="176" fill="url(#panel)"/><rect x="3" y="3" width="714" height="176" fill="url(#scan)"/><rect x="3.5" y="3.5" width="713" height="175" fill="none" stroke="#3fd6ec" stroke-opacity="0.25"/><path d="M3,17 V3 H17" fill="none" stroke="#3fd6ec" stroke-width="2"/><path d="M703,3 H717 V17" fill="none" stroke="#3fd6ec" stroke-width="2"/><path d="M3,165 V179 H17" fill="none" stroke="#3fd6ec" stroke-width="2"/><path d="M703,179 H717 V165" fill="none" stroke="#3fd6ec" stroke-width="2"/><text x="704" y="22" font-size="10" fill="#3fd6ec" text-anchor="end" opacity="0.8">// HH-DECOMP SYS</text><text x="16" y="28" font-size="17" font-weight="600" fill="#d4ecff">Big functions (2 KB and up): one lead, many helpers</text><line x1="250.0" y1="40" x2="250.0" y2="142" stroke="#1c3552"/><text x="250.0" y="156" font-size="11" fill="#7d98b4" text-anchor="middle">0%</text><line x1="350.0" y1="40" x2="350.0" y2="142" stroke="#1c3552"/><text x="350.0" y="156" font-size="11" fill="#7d98b4" text-anchor="middle">25%</text><line x1="450.0" y1="40" x2="450.0" y2="142" stroke="#1c3552"/><text x="450.0" y="156" font-size="11" fill="#7d98b4" text-anchor="middle">50%</text><line x1="550.0" y1="40" x2="550.0" y2="142" stroke="#1c3552"/><text x="550.0" y="156" font-size="11" fill="#7d98b4" text-anchor="middle">75%</text><line x1="650.0" y1="40" x2="650.0" y2="142" stroke="#1c3552"/><text x="650.0" y="156" font-size="11" fill="#7d98b4" text-anchor="middle">100%</text><text x="240" y="61" font-size="13" fill="#d4ecff" text-anchor="end">Opus alone</text><rect x="250" y="47" width="36.4" height="20" rx="3" fill="#ffad3b"/><text x="292.4" y="61" font-size="12" fill="#d4ecff">9% <tspan fill="#7d98b4">(2/22)</tspan></text><text x="240" y="95" font-size="13" fill="#d4ecff" text-anchor="end">Sonnet alone (6 functions)</text><rect x="250" y="81" width="2.0" height="20" rx="3" fill="#ffad3b"/><text x="256.0" y="95" font-size="12" fill="#d4ecff">0% <tspan fill="#7d98b4">(0/6)</tspan></text><text x="240" y="129" font-size="13" fill="#d4ecff" text-anchor="end">Opus lead + Sonnet helpers</text><rect x="250" y="115" width="90.9" height="20" rx="3" fill="#b78cff"/><text x="346.9" y="129" font-size="12" fill="#d4ecff">23% <tspan fill="#7d98b4">(5/22)</tspan></text><text x="16" y="172" font-size="11" fill="#7d98b4">Opus alone and Opus + Sonnet helpers got the same 22 functions at about the same cost.</text></svg>
